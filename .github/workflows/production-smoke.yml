name: Production smoke

# Runs after a push to main has been deployed. Deliberately does NOT auto-rollback:
# rolling back production is a human decision, and an automated rollback triggered
# by a flaky check would be worse than the failure it responds to.
# The rollback procedure lives in docs/RUNBOOK.md (written in Phase 23).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Production URL to smoke test'
        required: true
        type: string
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    defaults:
      run:
        # The container's default shell is dash, which has no `set -o pipefail`.
        shell: bash
    env:
      HOME: /root
      # The STABLE production alias, not the per-deployment URL. Measured
      # 2026-08-14: the alias is publicly reachable while immutable
      # per-deployment URLs sit behind Vercel Authentication.
      E2E_BASE_URL: ${{ inputs.url || vars.PRODUCTION_URL || 'https://evolutionary-tycoon.vercel.app' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.13.1'
      - run: pnpm install --frozen-lockfile

      - name: Health probe
        # The expected schema version is read from src/config, never typed here.
        # It was hardcoded to 1, and Phase 3's migration to v2 turned this job
        # red on every push to main — silently, because production smoke runs
        # *after* the merge, so no PR ever showed it. A version number copied
        # into a workflow is guaranteed to go stale at the next migration.
        run: |
          set -euo pipefail
          echo "Target: $E2E_BASE_URL"
          curl -sfS "$E2E_BASE_URL/health.json" | tee /tmp/health.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { SAVE_SCHEMA_VERSION } from './src/config/simulation.ts';
            const h = JSON.parse(readFileSync('/tmp/health.json', 'utf8'));
            if (typeof h.buildSha !== 'string' || h.buildSha.length === 0) throw new Error('missing buildSha');
            if (h.schemaVersion !== SAVE_SCHEMA_VERSION) {
              throw new Error('deployed schemaVersion ' + h.schemaVersion + ', this commit expects ' + SAVE_SCHEMA_VERSION);
            }
            console.log('health ok:', h.version, h.buildSha.slice(0, 7), 'schema v' + h.schemaVersion);
          "

      - name: Smoke E2E
        run: pnpm exec playwright test --project=chromium tests/e2e/boot.spec.ts tests/e2e/health.spec.ts

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error::Production smoke failed for $E2E_BASE_URL."
          echo "::error::Follow docs/RUNBOOK.md — rollback is a human decision, not automatic."
