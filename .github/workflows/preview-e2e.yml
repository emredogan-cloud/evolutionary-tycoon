name: Preview E2E

# A green local build proves the code compiles. It does not prove the CDN serves
# the right artefact with the right security and cache headers. This workflow
# runs the suite against the real Vercel preview URL, which is where the
# deployment-facing assertions (headers.spec.ts, health.spec.ts) actually carry
# weight. See docs/GAME_EXECUTION_ROADMAP.md §23.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  verify-preview:
    name: Verify deployed preview
    # Only run once the deployment is actually live.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    defaults:
      run:
        # The container's default shell is dash, which has no `set -o pipefail`.
        shell: bash
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      # See ci.yml: root + a $HOME owned by another user stops Firefox launching.
      HOME: /root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.13.1'
      - run: pnpm install --frozen-lockfile

      - name: Show target
        run: echo "Testing against $E2E_BASE_URL"

      - name: Wait for the deployment, or detect that it is protected
        id: reach
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/health.json" || true)
            if [ "$code" = "200" ]; then
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              echo "health.json is up"
              exit 0
            fi

            # Distinguish "not ready yet" from "protected". Waiting never resolves
            # the second, and a bare timeout hides the real cause.
            if [ "$code" = "401" ] || [ "$code" = "302" ]; then
              loc=$(curl -s -o /dev/null -D - "$E2E_BASE_URL/health.json" | grep -i '^location:' || true)
              case "$loc" in
                *vercel.com/sso-api*)
                  echo "reachable=false" >> "$GITHUB_OUTPUT"
                  echo "::warning::Preview E2E skipped - Vercel Deployment Protection blocks per-deployment URLs."
                  {
                    echo "## Preview E2E skipped"
                    echo ""
                    echo "**Vercel Deployment Protection is enabled for per-deployment URLs.**"
                    echo ""
                    echo "Measured 2026-08-14: the stable production alias is publicly reachable (HTTP 200),"
                    echo "but the immutable per-deployment URLs reported by \`deployment_status\` return 302 to"
                    echo "Vercel SSO. This job therefore cannot reach the preview it exists to verify."
                    echo ""
                    echo "This is **not** a code failure, and it is **not** resolved by waiting."
                    echo ""
                    echo "### Fix A (recommended for a public game)"
                    echo "Vercel → Project → Settings → Deployment Protection → Vercel Authentication → **Disabled**."
                    echo ""
                    echo "### Fix B (keep protection)"
                    echo "Generate a Protection Bypass for Automation secret, store it as the"
                    echo "\`VERCEL_AUTOMATION_BYPASS_SECRET\` repository secret, and send it as the"
                    echo "\`x-vercel-protection-bypass\` header from this workflow."
                    echo ""
                    echo "Tracked in \`docs/PROJECT_MEMORY.md\` §16 as an open item."
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
              esac
            fi

            echo "attempt $i: health.json returned $code"
            sleep 5
          done
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "::error::$E2E_BASE_URL/health.json never returned 200 and did not look protected."
          exit 1

      - name: Assert the deployment serves this commit
        if: steps.reach.outputs.reachable == 'true'
        # This is the assertion that turns "Vercel accepted an upload" into
        # "the commit CI tested is the commit that is live".
        run: |
          set -euo pipefail
          DEPLOYED_SHA=$(curl -sf "$E2E_BASE_URL/health.json" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).buildSha));
          ")
          echo "deployed=$DEPLOYED_SHA expected=${{ github.event.deployment_status.deployment.sha || github.sha }}"
          EXPECTED="${{ github.event.deployment_status.deployment.sha || github.sha }}"
          if [ -n "$EXPECTED" ] && [ "$DEPLOYED_SHA" != "$EXPECTED" ]; then
            echo "::error::Deployed buildSha ($DEPLOYED_SHA) does not match the deployment commit ($EXPECTED)"
            exit 1
          fi

      - name: E2E against the live preview (Chromium)
        if: steps.reach.outputs.reachable == 'true'
        run: pnpm exec playwright test --project=chromium

      - name: Upload report
        if: always() && steps.reach.outputs.reachable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
