name: Preview E2E

# A green local build proves the code compiles. It does not prove the CDN serves
# the right artefact with the right security and cache headers. This workflow
# runs the suite against the real Vercel preview URL, which is where the
# deployment-facing assertions (headers.spec.ts, health.spec.ts) actually carry
# weight. See docs/GAME_EXECUTION_ROADMAP.md §23.
#
# This job is blocking. It previously detected Vercel Deployment Protection and
# skipped with a warning, because the per-deployment URLs that `deployment_status`
# reports returned 302 to Vercel SSO and no change in this repository could fix
# that. The project owner disabled Vercel Authentication on 2026-08-14
# (ssoProtection.enabled = false, verified against the API and by fetching a
# per-deployment URL), so the skip path is gone and a preview that cannot be
# verified now fails the run.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  verify-preview:
    name: Verify deployed preview
    # Only run once the deployment is actually live.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    defaults:
      run:
        # The container's default shell is dash, which has no `set -o pipefail`.
        shell: bash
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      # See ci.yml: root + a $HOME owned by another user stops Firefox launching.
      HOME: /root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.13.1'
      - run: pnpm install --frozen-lockfile

      - name: Show target
        run: echo "Testing against $E2E_BASE_URL"

      - name: Wait for the deployment to serve health.json
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/health.json" || true)
            if [ "$code" = "200" ]; then
              echo "health.json is up after ${i} attempt(s)"
              exit 0
            fi

            # Name the cause instead of timing out anonymously. A protected
            # deployment never becomes reachable by waiting, so it fails fast
            # with the fix written down rather than after 150 seconds.
            if [ "$code" = "401" ] || [ "$code" = "302" ]; then
              loc=$(curl -s -o /dev/null -D - "$E2E_BASE_URL/health.json" | grep -i '^location:' || true)
              case "$loc" in
                *vercel.com/sso-api*)
                  echo "::error::Vercel Deployment Protection is blocking $E2E_BASE_URL."
                  {
                    echo "## Preview E2E cannot reach the deployment"
                    echo ""
                    echo "\`$E2E_BASE_URL/health.json\` returned **$code** and redirected to Vercel SSO."
                    echo ""
                    echo "Deployment Protection was disabled on 2026-08-14 (decision D-09 in"
                    echo "\`docs/PROJECT_MEMORY.md\` §16). If it is on again, either turn it back off at"
                    echo "Project → Settings → Deployment Protection → Vercel Authentication, or add a"
                    echo "Protection Bypass for Automation secret as \`VERCEL_AUTOMATION_BYPASS_SECRET\`"
                    echo "and send it as the \`x-vercel-protection-bypass\` header from this workflow."
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            fi

            echo "attempt $i: health.json returned $code"
            sleep 5
          done
          echo "::error::$E2E_BASE_URL/health.json never returned 200."
          exit 1

      - name: Assert the deployment serves this commit
        # This is the assertion that turns "Vercel accepted an upload" into
        # "the commit CI tested is the commit that is live".
        run: |
          set -euo pipefail
          DEPLOYED_SHA=$(curl -sf "$E2E_BASE_URL/health.json" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).buildSha));
          ")
          EXPECTED="${{ github.event.deployment_status.deployment.sha || github.sha }}"
          echo "deployed=$DEPLOYED_SHA expected=$EXPECTED"
          if [ -n "$EXPECTED" ] && [ "$DEPLOYED_SHA" != "$EXPECTED" ]; then
            echo "::error::Deployed buildSha ($DEPLOYED_SHA) does not match the deployment commit ($EXPECTED)"
            exit 1
          fi

      - name: E2E against the live preview (Chromium)
        run: pnpm exec playwright test --project=chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
