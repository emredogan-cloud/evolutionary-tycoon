name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.13.1'
  # Pinned so goldens and E2E behave identically locally and in CI.
  # See docs/RESEARCH_NOTES.md §3.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble

jobs:
  quality:
    name: Quality (lint, types, architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Dead code / unused dependencies
        run: pnpm knip

      - name: Secret tripwire
        # Coarse and fast. GitHub push protection is the real net for a public
        # repo; this catches the common local accidents before they get there.
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "::error::A .env file is tracked. Secrets must live in Vercel project settings."
            exit 1
          fi
          if git grep -nIE '(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!pnpm-lock.yaml'; then
            echo "::error::Possible credential found in tracked files."
            exit 1
          fi
          echo "No obvious secrets in tracked files."

  assets:
    name: Asset pipeline (validate, budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate source art
        # ASSET_PIPELINE §4.3 step 4. Any rule violation fails the build; no
        # threshold may be lowered to make a batch pass. With no source art the
        # stage reports "0 assets" and passes, which is not the same as approving
        # anything — see the wording in tools/asset-pipeline/cli.ts.
        run: pnpm assets:validate && pnpm assets:prompt-coverage

      - name: Build atlases, manifest and budget report
        # §13 budgets and the §7 atlas fill floor. Over budget is a red build:
        # this is a Vercel bandwidth constraint as much as a performance one.
        run: pnpm assets:build

      - name: Placeholders are reproducible from source
        # The committed placeholder set is derived from src/config dimensions.
        # If a world dimension changes without regenerating them, the images and
        # the layout they stand in for have silently diverged.
        run: |
          set -euo pipefail
          pnpm placeholders:build
          if ! git diff --quiet -- assets/_placeholder; then
            echo "::error::assets/_placeholder is stale. Run pnpm placeholders:build and commit."
            git --no-pager diff --stat -- assets/_placeholder
            exit 1
          fi
          echo "Placeholders match their source."

  test:
    name: Unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Vitest with coverage thresholds
        run: pnpm test:coverage

      # Run again on its own so the determinism suite has a distinct signal in
      # the log. If it ever goes red, no other result in this pipeline means
      # what it claims to mean (docs/TESTING_STRATEGY.md §3.7).
      - name: Determinism suite
        run: pnpm test:determinism

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  perf:
    name: Simulation performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CI has no GPU, so it never measures or claims a frame rate. What it can
      # measure is the simulation, which is where the CPU cost actually is and
      # which is engine-independent by construction (docs/WORKING_DISCIPLINE.md §8).
      - name: Simulation benchmark and budgets
        # The recorded baseline must come from a CI run, not a laptop: comparing
        # a local number against a shared runner would make every run look like a
        # regression, or hide a real one. The job prints a copy-ready baseline.
        env:
          BENCH_RECORDED_AT: ${{ github.sha }}
          BENCH_ENVIRONMENT: github-actions ubuntu-24.04, node ${{ env.NODE_VERSION }}
        run: pnpm bench:sim

  balance:
    name: Economy balance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The ten assertions of ECONOMY_DESIGN §13, run against the real
      # simulation core. This is the gate that makes economy balance a testable
      # contract rather than an opinion: a config change that breaks the pacing
      # cannot be merged. One of the ten — the dead-end rule — is marked
      # merge-blocking by the design itself and is asserted separately so a
      # failure of *that* one is unmistakable in the log.
      #
      # Two simulated hours per policy, five policies, inside a ninety-second
      # budget that the suite asserts on itself.
      - name: Economy assertions
        run: pnpm balance:check

  build:
    name: Build + bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # resolveBuildSha() prefers GITHUB_SHA, but a full checkout keeps the
          # git fallback usable too.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The atlases are pipeline output, not tracked files — a clean checkout
      # has none, and since the render layer started fetching them at runtime
      # a dist built without this step boots into placeholder mode. Same order
      # pnpm verify uses.
      - name: Asset pipeline
        run: pnpm assets:build

      - name: Build
        run: pnpm build

      - name: Verify /health.json carries this commit
        run: |
          set -euo pipefail
          test -f dist/health.json || { echo "::error::dist/health.json was not emitted"; exit 1; }
          cat dist/health.json
          BUILT_SHA=$(node -p "require('./dist/health.json').buildSha")
          if [ "$BUILT_SHA" != "${GITHUB_SHA}" ]; then
            echo "::error::health.json buildSha ($BUILT_SHA) != GITHUB_SHA (${GITHUB_SHA})"
            exit 1
          fi
          echo "health.json buildSha matches the commit."

      - name: Bundle budgets
        run: pnpm size

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    env:
      # The container runs as root while $HOME defaults to /github/home, which is
      # owned by pwuser. Firefox refuses to launch in that situation
      # ("Running Nightly as root in a regular user's session is not supported").
      # This is Playwright's own documented workaround.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run E2E
        # Firefox WebGL is unstable headless without a virtual framebuffer
        # (microsoft/playwright#21783), so it runs under xvfb.
        run: |
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            xvfb-run --auto-servernum pnpm exec playwright test --project=firefox
          else
            pnpm exec playwright test --project=chromium
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same pinned image the goldens were generated in. Verified rather than
    # assumed: generating the set on the host and in this container produced
    # byte-identical PNGs (docs/phases/PHASE_3_REPORT.md §6).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Chromium only, under forced software rasterisation. Headless WebKit does
      # not render canvas into screenshots and headless Firefox WebGL needs a
      # virtual framebuffer, so a golden from either would measure the harness
      # (ADR-011).
      - name: Visual goldens
        run: pnpm test:visual

      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  webkit-smoke:
    name: WebKit smoke (non-blocking)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Informational. Headless WebKit cannot screenshot canvas and has no hardware
    # acceleration, so it validates boot/DOM/console only and must not gate merge
    # on platform limitations we do not control (docs/TESTING_STRATEGY.md §7.7).
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright test --project=webkit-smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit (high and critical fail the build)
        run: pnpm audit --audit-level=high
